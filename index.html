<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Judhūr — Arabic study</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1930">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Judhūr">
<style>
  /* Fonts are served from this repo, not a CDN. [R-11] requires the study loop
     to work with no network, and a Google Fonts link made Arabic render in a
     fallback face on a cold offline start or from file:// — the home screen
     even carried the caveat "everything runs offline after the fonts load".
     Self-hosting also removes the one third-party request the app made, which
     Settings otherwise promised it didn't. Latin and Arabic subsets only;
     regenerate with tools/sync-fonts.mjs. All three families are SIL OFL 1.1
     (fonts/OFL.txt). */
  /* Fraunces — latin */
  @font-face {
    font-family: 'Fraunces';
    font-style: normal;
    font-weight: 500 600;
    font-display: swap;
    src: url('fonts/fraunces-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  /* Inter — latin */
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('fonts/inter-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  /* Noto Naskh Arabic — arabic */
  @font-face {
    font-family: 'Noto Naskh Arabic';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('fonts/noto-naskh-arabic.woff2') format('woff2');
    unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC, U+102E0-102FB, U+10E60-10E7E, U+10EC2-10EC4, U+10EFC-10EFF, U+1EE00-1EE03, U+1EE05-1EE1F, U+1EE21-1EE22, U+1EE24, U+1EE27, U+1EE29-1EE32, U+1EE34-1EE37, U+1EE39, U+1EE3B, U+1EE42, U+1EE47, U+1EE49, U+1EE4B, U+1EE4D-1EE4F, U+1EE51-1EE52, U+1EE54, U+1EE57, U+1EE59, U+1EE5B, U+1EE5D, U+1EE5F, U+1EE61-1EE62, U+1EE64, U+1EE67-1EE6A, U+1EE6C-1EE72, U+1EE74-1EE77, U+1EE79-1EE7C, U+1EE7E, U+1EE80-1EE89, U+1EE8B-1EE9B, U+1EEA1-1EEA3, U+1EEA5-1EEA9, U+1EEAB-1EEBB, U+1EEF0-1EEF1;
  }
  /* Noto Naskh Arabic — latin */
  @font-face {
    font-family: 'Noto Naskh Arabic';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('fonts/noto-naskh-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root{
    --bg:#12213A; --bg-deep:#0D1930; --surface:#1B3054; --surface-lt:#25406B;
    --gold:#C9A24B; --teal:#4F8A8B; --coral:#C1592E; --amber:#B8935A;
    --ink:#F4EFE1; --muted:#9FB2C9;
    --display:'Fraunces',Georgia,serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
    --arabic:'Noto Naskh Arabic','Traditional Arabic','Geeza Pro',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg-deep);color:var(--ink);font-family:var(--body);font-size:16px}
  body{min-height:100vh}
  button{font-family:inherit;border:none;cursor:pointer;color:inherit}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
       display:flex;flex-direction:column;position:relative;overflow:hidden}

  /* header */
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
  .brand-ar{font-family:var(--arabic);color:var(--gold);font-size:23px;line-height:1}
  .brand-en{font-family:var(--display);font-size:12.5px;letter-spacing:.6px;opacity:.65;margin-top:2px}
  .chips{display:flex;gap:8px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--surface);
        padding:6px 12px;border-radius:99px;font-size:14.5px;font-weight:600}
  .chip svg{width:15px;height:15px;display:block}

  /* body / nav */
  main{flex:1;overflow-y:auto;padding:4px 20px 96px}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;
      background:var(--bg-deep);border-top:1px solid var(--surface-lt);z-index:5}
  .nav-in{max-width:480px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
  nav button{background:none;display:flex;flex-direction:column;align-items:center;
             gap:4px;padding:12px 0 14px;color:var(--muted);font-size:11.5px;font-weight:600}
  nav button.on{color:var(--gold)}
  nav svg{width:23px;height:23px}

  /* generic */
  h1.tt{font-family:var(--display);font-size:22px;font-weight:600;margin:8px 0 0}
  p.sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin:4px 0 0}
  .card{background:var(--surface);border-radius:14px}
  .stars{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 0}
  .stars svg{width:10px;height:10px;opacity:.35}
  .stars svg.mid{opacity:.9}

  /* home */
  .hero{background:linear-gradient(135deg,var(--surface),var(--surface-lt));
        border-radius:18px;padding:20px;margin-top:10px}
  .hero .eyebrow{color:var(--muted);font-size:13px}
  .hero h2{font-family:var(--display);font-size:26px;font-weight:600;margin:2px 0 0}
  .hero p{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 0}
  .btn-gold{width:100%;background:var(--gold);color:var(--bg-deep);font-weight:700;
            font-size:15px;padding:13px;border-radius:12px;margin-top:16px}
  .btn-teal{width:100%;background:var(--teal);color:var(--bg-deep);font-weight:700;
            font-size:14px;padding:11px;border-radius:12px;margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
  .stat{padding:14px}
  .stat .lbl{color:var(--muted);font-size:11.5px;margin-bottom:4px}
  .stat .val{font-family:var(--display);font-size:20px;font-weight:600}
  .stat .sub2{color:var(--muted);font-size:10.5px;margin-top:2px}

  /* alphabet grid */
  .alpha{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .tile{background:var(--surface);border-radius:12px;min-height:120px;padding:12px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;border:1.5px solid transparent;cursor:pointer}
  .tile.known{border-color:var(--gold)}
  .tile.learning{border-color:rgba(79,138,139,.45)}
  .tile .big{font-family:var(--arabic);font-size:40px}
  .tile .nm{font-size:12px;color:var(--muted);margin-top:5px}
  .tile .ex{font-family:var(--arabic);font-size:15px;color:var(--gold);direction:rtl}
  .tile .exs{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.3}
  .tile .row{display:flex;gap:8px;margin-top:9px}
  .tile .row button{background:var(--bg-deep);border-radius:8px;padding:8px 10px;display:flex}
  .tile .row svg{width:16px;height:16px}

  /* roots */
  .rootlist{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .root{background:var(--surface);border-radius:12px;overflow:hidden}
  .root-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer}
  .root-hd .lt{display:flex;align-items:center;gap:12px}
  .root-ar{font-family:var(--arabic);font-size:18px;color:var(--gold);direction:rtl}
  .root-mn{font-size:13.5px;font-weight:600}
  .root-ct{font-size:11px;color:var(--muted)}
  .root-bd{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
  .word{background:var(--bg-deep);border-radius:9px;padding:10px;
        display:flex;align-items:center;justify-content:space-between}
  .word .w-ar{font-family:var(--arabic);font-size:19px;direction:rtl}
  .word .w-en{font-size:12.5px;color:var(--muted);margin-top:2px}
  .pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}

  /* roadmap */
  .phase{padding:16px;margin-bottom:11px}
  .phase .top{display:flex;justify-content:space-between;align-items:center}
  .phase .ph{color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:.7px}
  .phase .wk{color:var(--muted);font-size:11px}
  .phase h3{font-family:var(--display);font-size:17px;font-weight:600;margin:3px 0 0}
  .phase .goal{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:5px}
  .phase .tip{border-top:1px solid var(--surface-lt);margin-top:11px;padding-top:10px;
              color:var(--teal);font-size:11.5px;line-height:1.5}

  /* heatmap */
  .heat{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .heat div{aspect-ratio:1/1;border-radius:3px;background:var(--bg-deep)}
  .heat div.on{background:var(--gold)}
  .gate{margin-top:12px;font-size:11.5px;line-height:1.55;color:var(--muted)}
  .gate.under{color:var(--amber);background:rgba(184,147,90,.12);
              border:1px solid rgba(184,147,90,.3);border-radius:8px;padding:9px 11px}

  /* session overlay */
  #ovl{position:fixed;inset:0;background:var(--bg-deep);z-index:20;
       display:none;flex-direction:column;padding:18px}
  #ovl.show{display:flex}
  .ov-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .ov-top button{background:none;color:var(--muted);display:flex;padding:4px}
  .ov-top svg{width:20px;height:20px}
  .ov-ct{font-size:12px;color:var(--muted);font-weight:600}
  .bar{height:4px;background:var(--surface);border-radius:99px;margin-bottom:28px}
  .bar i{display:block;height:4px;background:var(--gold);border-radius:99px;transition:width .25s}
  .ov-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .q-letter{font-family:var(--arabic);font-size:74px;line-height:1}
  .q-word{font-family:var(--arabic);font-size:46px;direction:rtl;line-height:1.3;display:inline-block}
  /* gendered pair: both forms, each labelled ([R-51]) */
  .genpair{display:flex;flex-direction:column;gap:2px;align-items:center}
  .genform{display:flex;align-items:baseline;gap:10px}
  .genform .q-word{font-size:38px}
  .genlbl{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.5px;
          min-width:16px;text-align:right;flex:none}
  .w-gen{display:flex;flex-direction:column;gap:1px}
  .w-gen .gl{font-size:9.5px;font-weight:700;color:var(--teal);margin-inline-end:5px}
  .q-root{color:var(--teal);font-size:12px;margin-bottom:10px}
  .q-root span{font-family:var(--arabic);direction:rtl}
  .ans{margin-top:26px}
  .ans .a1{color:var(--gold);font-size:17px;font-weight:600}
  .ans .a2{color:var(--muted);font-size:13.5px;margin-top:5px;line-height:1.5}
  .ans .tr-read{font-style:italic}
  .tr-peek{background:none;border:none;color:var(--muted);font-size:12px;margin-top:6px;padding:0;
           cursor:pointer;opacity:.7;text-decoration:underline dotted}
  /* top-right card controls + context menu */
  .ov-ctrls{margin-left:auto;display:flex;gap:6px}
  .ovbtn{background:var(--surface);border:1px solid var(--surface-lt);color:var(--muted);
         min-width:38px;height:32px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
         display:flex;align-items:center;justify-content:center;padding:0 8px}
  .ovbtn svg{width:18px;height:18px}
  .ovbtn.on{color:var(--gold);border-color:var(--gold)}
  .cardmenu{position:absolute;right:12px;top:52px;z-index:5;background:var(--surface);
            border:1px solid var(--surface-lt);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .cardmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);
                   font-size:13px;padding:9px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .cardmenu button:hover{background:var(--surface-lt)}
  .playbtn.syn{border-color:var(--amber);color:var(--amber)}
  /* settings toggles + sub-page links */
  .set-row{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
  .toggle{flex:none;width:44px;height:26px;border-radius:13px;border:1px solid var(--surface-lt);
          background:var(--bg-deep);position:relative;cursor:pointer;margin-top:2px;transition:background .15s}
  .toggle span{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
               background:var(--muted);transition:transform .15s,background .15s}
  .toggle.on{background:rgba(79,138,139,.4);border-color:var(--teal)}
  .toggle.on span{transform:translateX(18px);background:var(--teal)}
  .tts-status{margin-top:11px;font-size:12px;line-height:1.5;padding:9px 11px;border-radius:8px}
  .tts-status.ok{color:var(--muted);background:var(--bg-deep)}
  .tts-status.warn{color:var(--amber);background:rgba(184,147,90,.12);border:1px solid rgba(184,147,90,.3)}
  .subback{background:none;border:none;color:var(--teal);font-size:13px;font-weight:600;cursor:pointer;
           display:flex;align-items:center;gap:4px;padding:6px 0;margin-top:4px}
  .subback svg{width:18px;height:18px}
  .linkcard{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
            background:var(--surface);border:1px solid var(--surface-lt);border-radius:12px;
            padding:15px 16px;margin-bottom:9px;cursor:pointer;text-align:left;color:var(--ink)}
  .linkcard .lc-t{font-size:15px;font-weight:600}
  .linkcard .lc-s{font-size:12.5px;color:var(--muted);margin-top:3px}
  .linkcard .lc-ch{color:var(--muted);display:flex}.linkcard .lc-ch svg{width:18px;height:18px}
  /* library passage word-by-word */
  .passage .pw{font-family:var(--arabic);font-size:26px;line-height:1.7;background:none;border:none;
               color:var(--ink);cursor:pointer;padding:2px 3px;border-radius:6px;direction:rtl}
  .passage .pw.known{color:var(--gold)}
  .passage .pw.sel{background:var(--surface-lt)}
  .wordgloss{margin-top:12px;background:var(--surface);border:1px solid var(--surface-lt);
             border-radius:10px;padding:12px 14px;font-size:14px}
  .nw-in{color:var(--teal);font-size:12px;font-weight:600;white-space:nowrap}
  .nw-add{background:rgba(201,162,75,.16);color:var(--gold);border:none;border-radius:8px;
          font-size:12.5px;font-weight:600;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap}
  .nw-add svg{width:14px;height:14px}
  .nw-lib{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .nw.flagged{opacity:.6;border:1px solid rgba(193,89,46,.4)}
  .nw-flag{color:var(--coral);font-size:11px;margin-top:3px}
  .nw-bad{background:none;border:1px solid var(--surface-lt);color:var(--muted);border-radius:8px;
          font-size:12px;padding:6px 9px;cursor:pointer;white-space:nowrap}
  .nw-bad.on{color:var(--coral);border-color:rgba(193,89,46,.5)}
  .unver{color:var(--amber);font-weight:700;margin-left:2px;cursor:help}
  .nw-lib .nw-txt{min-width:0}
  .ans .a3{font-family:var(--arabic);font-size:21px;direction:rtl;margin-top:18px}
  .ans .a4{color:var(--muted);font-size:12px;margin-top:4px}
  .reveal{width:100%;background:var(--surface);color:var(--ink);font-weight:600;
          font-size:16.5px;padding:17px;border-radius:12px}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grades button{padding:16px 0;border-radius:12px;font-size:14.5px;font-weight:700}
  .done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .done-wrap h2{font-family:var(--display);font-size:27px;font-weight:600;margin:14px 0 0}
  .done-wrap p{color:var(--muted);font-size:14px;margin:8px 0 0}

  /* letter forms, audio, register tags */
  .formrow{display:flex;gap:12px;justify-content:center;margin-top:8px;direction:rtl}
  .formrow .f{display:flex;flex-direction:column;align-items:center;gap:2px}
  .formrow .f .g{font-family:var(--arabic);font-size:21px;line-height:1.2}
  .formrow .f .l{font-size:8.5px;color:var(--muted);letter-spacing:.3px}
  .gutt{display:inline-block;font-size:9px;font-weight:700;color:var(--coral);
        background:rgba(193,89,46,.16);border-radius:99px;padding:2px 7px;margin-top:6px}
  .regtag{display:inline-block;font-size:8.5px;font-weight:700;color:var(--teal);
          background:rgba(79,138,139,.16);border-radius:99px;padding:1px 6px;
          letter-spacing:.4px;vertical-align:1px}
  .playbtn{background:var(--bg-deep);border-radius:11px;min-width:46px;min-height:46px;
           padding:11px 14px;display:inline-flex;align-items:center;justify-content:center;color:var(--gold)}
  .playbtn svg{width:20px;height:20px}
  .playbtn.miss{color:var(--muted);opacity:.45}
  .ab-row{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px}
  .cue{font-size:13px;color:var(--muted);line-height:1.55;max-width:300px;
       margin:14px auto 0;text-align:center}
  .cue-h{display:block;font-weight:700;color:var(--teal);font-size:12px;
         letter-spacing:.3px;margin-bottom:3px}
  .cue-ar{font-family:var(--arabic);color:var(--ink);font-size:18px;direction:rtl}
  .covlist{max-height:150px;overflow-y:auto;font-size:12px;color:var(--muted);
           line-height:1.7;margin-top:8px;font-family:ui-monospace,monospace}
  /* content ingestion */
  .ing-wrap{flex:1;overflow-y:auto;padding:4px 2px 10px;display:flex;flex-direction:column}
  textarea.inp{resize:vertical;line-height:1.5;font-size:14px}
  .ing-or{text-align:center;color:var(--muted);font-size:12px;margin:10px 0}
  .ing-load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
            text-align:center;color:var(--ink);font-size:16px;padding:40px 0;line-height:1.6}
  .prov{color:var(--teal);font-size:12px;font-weight:600;margin-top:6px}
  .passage{font-family:var(--arabic);font-size:26px;direction:rtl;line-height:2;
           color:var(--ink);margin:10px 0;background:var(--surface);border-radius:12px;padding:16px}
  .p-tr{color:var(--muted);font-size:13px;line-height:1.6}
  .p-en{font-size:14px;line-height:1.6;margin-top:8px}
  .p-gr{color:var(--teal);font-size:12.5px;line-height:1.6;margin-top:8px;
        border-top:1px solid var(--surface-lt);padding-top:8px}
  .nw-h{font-family:var(--display);font-size:15px;font-weight:600;margin:16px 0 6px}
  .nw{background:var(--bg-deep);border-radius:9px;padding:10px 12px;margin-bottom:6px}
  .nw-ar{font-family:var(--arabic);font-size:19px;direction:rtl}
  .nw-tr{color:var(--gold);font-size:12.5px}
  .nw-en{color:var(--muted);font-size:12px;margin-top:2px}
  .ing-note{color:var(--amber);font-size:11.5px;line-height:1.5;margin-top:12px;
            background:rgba(184,147,90,.12);border-radius:8px;padding:9px 11px}
  .ing-err{color:var(--coral);font-size:13px;line-height:1.5;margin:16px 0 8px;
           white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto}
  /* diacritic fade */

/* ---------- build the deck ---------- */
var DECK = [];
ALPHABET.forEach(function(a){ DECK.push({id:'a-'+a.id,type:'alphabet',d:a}); });
ROOTS.forEach(function(r){
  r.words.forEach(function(w){
    DECK.push({id:w.id,type:'vocab',d:{ar:w.ar,t:w.t,en:w.en,a:w.a,reg:w.reg,f:w.f||null,
      root:r.root,rootId:r.id,rootMeaning:r.meaning}});
  });
});
/* One-time remap of index-based card ids onto the stable ones. Derivable
   without a lookup table because the array order still matches the order the
   old ids encoded. Idempotent, and safe to run again after a sync pulls
   un-migrated state from another device. Collisions keep the stronger record,
   matching the merge rule (more reps wins, then the later due date). */
function migrateIds(st){
  if(!st) return st;
  var map = {};
  ROOTS.forEach(function(r,ri){ r.words.forEach(function(w,wi){ map['v-'+ri+'-'+wi] = w.id; }); });
  function better(x,y){ return !y ? x : !x ? y : x.reps>y.reps ? x : y.reps>x.reps ? y : (x.due>y.due?x:y); }
  ['progress','prod'].forEach(function(k){
    var src = st[k]; if(!src) return;
    Object.keys(src).forEach(function(old){
      var nu = map[old]; if(!nu) return;
      src[nu] = better(src[old], src[nu]); delete src[old];
    });
  });
  if(st.pins) Object.keys(st.pins).forEach(function(old){
    var nu = map[old]; if(!nu) return;
    var a = st.pins[old], b = st.pins[nu];
    st.pins[nu] = (b && b.t > a.t) ? b : a; delete st.pins[old];
  });
  (st.log||[]).forEach(function(e){ if(map[e.id]) e.id = map[e.id]; });
  (st.speech||[]).forEach(function(e){ if(map[e.id]) e.id = map[e.id]; });
  return st;
}

/* ---------- date helpers ----------
   A study "day" is the learner's LOCAL day. Every date in state is a local
   YYYY-MM-DD string, formatted by ymd() and parsed back as local midnight.
   (Previously today() formatted in UTC while addDays() parsed as local: east
   of UTC that made addDays(d,n) return d+n-1, so every interval was a day
   short and the heatmap never lit today; west of UTC the day rolled over in
   the late afternoon, so evening study was credited to tomorrow.) */
function ymd(d){
  var m=d.getMonth()+1, x=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;
}
function today(){ return ymd(new Date()); }
function addDays(s,n){ var d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function dayDiff(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }

/* ---------- SM-2-ish scheduler ---------- */
function schedule(prev,q){
  var iv = prev?prev.interval:0, ease = prev?prev.ease:2.5, reps = prev?prev.reps:0;
  if(q===0) return {interval:0,ease:Math.max(1.3,ease-0.2),reps:0,due:today()};
  reps++;
  if(q===1) ease = Math.max(1.3,ease-0.15);
  if(q===3) ease = ease+0.15;
  if(reps===1) iv=1; else if(reps===2) iv=3; else iv=Math.max(1,Math.round(iv*ease));
  return {interval:iv,ease:ease,reps:reps,due:addDays(today(),iv)};
}

/* ---------- audio ----------
   Human recordings are the gold standard (§7). When one is missing, fall back to a
   synthetic voice — clearly labeled — so words are still audible before a human clip
   exists ([R-24], amended v0.11): the device's own Arabic voice offline, or the
   backend's Azure neural voice when configured. Files: audio/letters/<key>.mp3,
   audio/words/<a>.mp3. The Settings tab has a coverage check. */
var AUDIO_MISSING = {};
/* Which committed clips are machine-generated. [R-24a] requires synthetic audio to
   be labelled wherever it plays — without this a generated clip sitting at the same
   path as a human recording would be presented as one. Written by
   tools/gen-audio.mjs; delete a line when a human recording replaces that file. */
var AUDIO_SYNTH = {};
fetch('audio/synthetic.json').then(function(r){ return r.ok ? r.json() : null; })
  .then(function(j){
    if(!j || !j.files) return;
    j.files.forEach(function(f){ AUDIO_SYNTH[f] = true; });
    render();
  }).catch(function(){ /* no manifest: nothing is claimed either way */ });
var audioEl = null;
function letterSrc(id){ return 'audio/letters/'+LETTER_META[id].key+'.mp3'; }
function wordSrc(w){ return 'audio/words/'+w.a+'.mp3'; }
function playAudio(src, text, reg){
  if(AUDIO_MISSING[src]){ if(text) speakText(text, reg); return; }   /* known-missing → synthetic */
  if(!audioEl) audioEl = new Audio();
  var fail = function(){
    if(!AUDIO_MISSING[src]){ AUDIO_MISSING[src]=true; saveMissing(); }
    if(text){ speakText(text, reg); } else render();
  };
  audioEl.onerror = fail;
  audioEl.src = src;
  var p = audioEl.play();
  if(p && p.catch) p.catch(fail);
}
function playBtn(src, text, reg){
  var miss = AUDIO_MISSING[src], canSay = !!text && !!S.settings.tts, muted = miss && !canSay;
  var synth = !miss && AUDIO_SYNTH[src];       /* a committed clip, but machine-made */
  var title = muted ? 'no clip yet — see Settings → Audio coverage'
            : miss ? 'synthetic voice — no clip for this word yet'
            : synth ? 'synthetic clip — not a human recording'
            : 'play recording';
  return '<button class="playbtn'+(muted?' miss':'')+((miss&&canSay)||synth?' syn':'')+'" data-play="'+esc(src)+'"'
       + (text?' data-say-fb="'+esc(text)+'"':'')
       + (reg?' data-say-reg="'+esc(reg)+'"':'')
       + ' title="'+title+'">'+svg(IC.spk)+'</button>';
}
/* Synthetic speech (§7, amended [R-24]) — always a fallback, never the gold standard.
   Azure neural voice when the backend is configured (cached per text); otherwise the
   device's built-in Arabic voice via the Web Speech API (free, offline). */

      } else if(!good){                    /* low/mediocre but no single sound pinned down */
        head = '<div class="t1 no">Needs work'+sc+'</div>';
        note = det.length
          ? 'The checker scored the word low but didn’t pinpoint which sound — treat this as a rough hint.'
          : 'Close, but the checker wasn’t fully convinced — try saying it once more.';
      } else {
        head = '<div class="t1 ok">Came through clearly'+sc+' ✓</div>';
        note = 'Nothing was flagged — but the checker misses some errors, so take this as encouragement, not a guarantee.';
      }
    }
    return head + coach + '<div class="prov-note">'+note+'</div>';
  }
  /* tier 1 intelligibility */
  return o.understood
    ? '<div class="t1 ok">understood ✓ — heard <span class="heard">'+esc(o.heard)+'</span></div>'
    : '<div class="t1 no">not understood — heard <span class="heard">'+esc(o.heard||'—')+'</span>. '
      + 'The listener may be at fault, not you. Try again or just move on.</div>';

function teardownMic(){
  if(!REC) return;
  clearTimeout(REC.timer);
  try{ if(REC.proc) REC.proc.disconnect(); if(REC.source) REC.source.disconnect(); }catch(e){}
  try{ if(REC.ac && REC.ac.state!=='closed') REC.ac.close(); }catch(e){}
  REC.stream.getTracks().forEach(function(t){ t.stop(); });
}
function cancelMic(){
  if(!REC) return;
  var id=REC.cardId; teardownMic(); REC=null; delete T1[id];
}
function toggleMic(cardId){
  if(REC){ if(REC.cardId===cardId){ stopMic(); } else { cancelMic(); } return; }
  var card = null;
  DECK.forEach(function(c){ if(c.id===cardId) card = c; });
  if(!card) return;
  var AC = audioCtxCtor();
  if(!AC){ T1[cardId] = {st:'err', msg:'recording not supported in this browser'}; render(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var ac = new AC();
    var source = ac.createMediaStreamSource(stream);
    var proc = ac.createScriptProcessor(4096, 1, 1);
    var mute = ac.createGain(); mute.gain.value = 0;   // capture without audible feedback
    REC = {cardId:cardId, stream:stream, expected:expectedFor(card), register:(card.d&&card.d.reg)||'msa',
           ac:ac, source:source, proc:proc, chunks:[]};
    proc.onaudioprocess = function(ev){
      if(REC) REC.chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
    };
    source.connect(proc); proc.connect(mute); mute.connect(ac.destination);
    if(ac.state==='suspended') ac.resume();
    T1[cardId] = {st:'rec'};
    REC.timer = setTimeout(stopMic, 4000);   // it's one word — keep it short
    render();
  }).catch(function(){
    T1[cardId] = {st:'err', msg:'microphone permission declined — speech checks stay off, everything else works'};
    render();
  });
}
function stopMic(){ if(REC) finishMic(); }
function finishMic(){
  var r = REC; REC = null;
  if(!r) return;
  var inRate = r.ac.sampleRate;
  var chunks = r.chunks;
  teardownMicFor(r);
  if(!chunks.length){ T1[r.cardId] = {st:'err', msg:'nothing recorded'}; render(); return; }
  var wav = chunksToWav(chunks, inRate);
  if(wav.samples < 1600){ T1[r.cardId] = {st:'err', msg:'recording too short — hold the mic a moment longer'}; render(); return; }
  T1[r.cardId] = {st:'busy'}; render();
  fetch(CFG.url.replace(/\/+$/,'')+'/assess', {
    method:'POST',
    headers:{'Authorization':'Bearer '+CFG.token, 'Content-Type':'application/json'},
    body: JSON.stringify({expected:r.expected, audio:wav.b64, register:r.register||'msa',
                          contentType:'audio/wav; codecs=audio/pcm; samplerate=16000', coach:true})
  }).then(function(res){
    if(!res.ok) return res.json().then(function(j){ throw new Error(j.error||('backend said '+res.status)); },
                                       function(){ throw new Error('backend said '+res.status); });
    return res.json();
  }).then(function(out){
    T1[r.cardId] = {st:'done', r: out};
    var ok = out.tier===2 ? (out.notRecognized ? false : (out.detected ? out.detected.length===0 : null)) : !!out.understood;
    /* Append-only [R-32]. Keeps the structured verdict — what was heard, the
       composite score, and which sounds were flagged — so §11.3's question
       ("what is Azure's real per-phoneme accuracy on THIS voice?") has a
       record to work from later.
       NOT the §11.3 calibration pool: [R-33] requires the AUDIO to be retained,
       and it isn't — the recording is discarded the moment this returns. A
       reviewer cannot label a score they can't listen to. Retaining audio needs
       storage on the learner's own backend (an R2 bucket), which is unbuilt. */
    S.speech.push({k:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
                   d:today(), id:r.cardId, tier:out.tier||1, ok:ok, audio:false,
                   heard:out.heard||null,
                   pron:(out.pron!=null?out.pron:(out.overall!=null?out.overall:null)),
                   det:(out.detected||[]).map(function(x){ return {p:x.phoneme, s:x.score, i:!!x.inferred}; })});
    persist(); render();
  }).catch(function(e){
    T1[r.cardId] = {st:'err', msg:'speech check unavailable — '+e.message+'. Studying continues.'};
    render();
  });
}
function teardownMicFor(r){
  try{ if(r.proc) r.proc.disconnect(); if(r.source) r.source.disconnect(); }catch(e){}
  try{ if(r.ac && r.ac.state!=='closed') r.ac.close(); }catch(e){}
  r.stream.getTracks().forEach(function(t){ t.stop(); });
}

/* ---------- state ----------
   One place that fills in every field and runs every migration, so a state
   loaded from disk, merged from another device, or freshly reset all end up
   in the same shape. */
function blankState(){ return {xp:0,streak:0,best:0,last:null,history:[],progress:{}}; }
function ensureShape(st){
  st = migrateIds(st) || blankState();
  if(!st.progress) st.progress = {};
  if(!st.history) st.history = [];
  if(!st.prod) st.prod = {};          /* production (speaking) track — separate from recognition [R-29] */
  if(!st.userCards) st.userCards = [];/* words materialized from ingested content (§5) */
  if(!st.passages) st.passages = [];  /* generated reading passages, with provenance [R-14] */
  if(!st.settings) st.settings = {};  /* display prefs (e.g. diacritics stage) */
  if(!st.setT) st.setT = {};          /* per-setting last-change ms, for the sync merge */
  if(!st.log) st.log = [];            /* append-only review log [R-32] */
  if(!st.speech) st.speech = [];      /* append-only speech attempts [R-32] */
  if(!st.flags) st.flags = [];        /* append-only "this word is wrong" reports [R-48] */
  /* Per-card harakat pin [R-36]. Stored as {id:{v:0|1,t:ms}} so an UNpin is a
     real event that survives a sync — the old {id:true} shape had no way to
     express "no longer pinned", so a union merge re-pinned it forever. */
  if(!st.pins) st.pins = {};
  if(st.pinFull){                     /* migrate the old shape once */
    Object.keys(st.pinFull).forEach(function(k){ if(st.pinFull[k] && !st.pins[k]) st.pins[k] = {v:1,t:0}; });
    delete st.pinFull;
  }
  /* Ingested words now live in the Library and only enter daily reviews on opt-in.
     Cards materialized before this change were auto-added, so treat a missing flag
     as already-in-review to avoid silently pulling them out. */
  st.userCards.forEach(function(w){ if(w.inReview===undefined) w.inReview = true; });
  if(st.settings.tts===undefined) st.settings.tts = true;   /* synthetic voice fills gaps until a human clip exists */
  return st;
}
var S = ensureShape(load());

/* Diacritic display (§11.2). Stored text is ALWAYS fully diacritized [R-35];
   these strip harakat at RENDER time only. */
var RE_HARAKAT = /[ً-ْٰ]/g;       // tanwin, short vowels, shadda, sukun, dagger alif
var RE_SHORTV  = /[ً-ِْٰ]/g; // all of the above EXCEPT shadda (ّ)
function stripHarakat(s){ return String(s).replace(RE_HARAKAT, ''); }
function partialHarakat(s){ return String(s).replace(RE_SHORTV, ''); }  // keep shadda (approximate partial)
function diacriticMode(){ return S.settings.diacritics || 'full'; }
/* Romanization visibility: per-card override wins, else the global default (#1/#2). */
function trShown(){ return sess && sess.showTr!==undefined ? sess.showTr : !!S.settings.trDefault; }
function pinned(id){ var p=S.pins[id]; return !!(p && p.v); }
function setPin(id,v){ S.pins[id] = {v: v?1:0, t: Date.now()}; }
function wordStage(cardId){
  if(pinned(cardId)) return 'full';                    /* per-card override [R-36] */
  var mode = diacriticMode();
  if(mode !== 'auto') return mode;                     /* 'full' or 'bare' chosen explicitly */
  var p = S.progress[cardId], iv = p ? p.interval : 0; /* fade on retention, not calendar [R-37] */
  return iv < 7 ? 'full' : iv < 30 ? 'partial' : 'bare';
}
function arDisplay(text, stage){
  return stage === 'bare' ? stripHarakat(text) : stage === 'partial' ? partialHarakat(text) : text;
}

/* Fold user (ingested) words into the review deck as vocab cards. Called at
   load and after any sync that may have pulled in new user cards. */
function mountUserCards(){
  DECK = DECK.filter(function(c){ return c.id.charAt(0) !== 'u'; });
  (S.userCards||[]).forEach(function(w){
    if(!w.inReview) return;   /* library words join the deck only once opted in (§5, #3) */
    DECK.push({id:w.id, type:'vocab', d:{ar:w.ar, t:w.translit, en:w.en, a:'', reg:w.reg||'msa',
      f:w.f||null, root:w.root||'', rootMeaning:w.root_meaning||'',
      source:w.source_title, source_ref:w.source_ref}});
  });

/* Which register the content pipeline writes in. Egyptian is where the media the
   learner actually consumes lives (§11.1), so it's a first-class choice rather than
   a hardcoded 'MSA'. It is deliberately NOT the default yet: generated Egyptian is
   harder to check, not easier — colloquial spelling is unstandardised, diacritics
   are not conventional for it, and the root-indexed dictionary that [R-18] leans on
   is an MSA reference. Flipping this before the verification in §6.6 exists makes
   the least-checked path also the most-used one. */
function targetRegister(){ return S.settings.target === 'egy' ? 'egy' : 'msa'; }
function targetRegisterName(){ return targetRegister() === 'egy' ? 'Egyptian Arabic (colloquial)' : 'MSA'; }
/* Learner profile for /generate — what makes output personal (§5.3). */
function learnerProfile(){
  var words=[], roots={};
  DECK.forEach(function(c){
    /* "Known" here means retained [R-28] — the generator is told what has
       actually stuck, not what has merely been seen twice. An inflated list
       is how graded output drifts above the learner's real level. */
    if(c.type==='vocab' && retained(c.id)){ words.push(c.d.ar); if(c.d.root) roots[c.d.root]=1; }
  });

function setPref(k,v){ S.settings[k]=v; S.setT[k]=Date.now(); persist(); }

   once it has survived a long interval — the same bar §8 sets for Phase 0
   (≥3 successful reps at an interval of ≥7 days). "Learning" is everything
   that has been graded at least once but hasn't cleared that bar yet. */
function retained(id,map){ var p=(map||S.progress)[id]; return !!p && p.reps>=3 && p.interval>=7; }
function learning(id,map){ var p=(map||S.progress)[id]; return !!p && p.reps>0 && !retained(id,map); }

/* Active study days inside the trailing 30-day window — the quantity [R-38]
   is defined over. Computed, not eyeballed off the heatmap. */
function activeDays(){
  var n=0; for(var i=0;i<30;i++){ if(S.history.indexOf(addDays(today(),-i))>-1) n++; }
  return n;
}

function logReview(id, track, q, before, after){

              b:before?before.interval:0, a:after.interval});

/* One place where a study day is recorded, so the three grading paths can't
   drift apart. Missed days are never penalised here [R-8]. */
function markStudied(){
  var td = today();
  if(S.last === td) return;
  if(S.last && dayDiff(S.last,td)===1) S.streak++; else S.streak=1;
  if(S.streak>S.best) S.best=S.streak;

/* Fisher–Yates in place. */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function dueList(filter){
  var due=[],fresh=[];
  DECK.forEach(function(c){
    if(filter && c.type!==filter) return;
    if(!S.progress[c.id]) fresh.push(c);
    else if(S.progress[c.id].due<=today()) due.push(c);
  });
  /* Keep spaced-repetition priority (more-overdue first) but shuffle before a STABLE
     sort so cards sharing a due date — the big "due today" pool — come up in a
     different order each session instead of always the same deck-order slice. */
  shuffle(due);
  due.sort(function(x,y){ var dx=S.progress[x.id].due, dy=S.progress[y.id].due; return dx<dy?-1:dx>dy?1:0; });

         +   '<span style="color:var(--muted);display:flex">'+svg(open?IC.chevD:IC.chev)+'</span>'
         + '</div>';
    if(open){
      out += '<div class="root-bd">';
      r.words.forEach(function(w){
        var id=w.id, p=S.progress[id];
        var st = !p ? 'new' : p.due<=today() ? 'due' : retained(id) ? 'retained' : 'learning';
        var PILL = {
          'new':     ['#9FB2C9','rgba(159,178,201,.15)'],
          'due':     ['#C1592E','rgba(193,89,46,.16)'],
          'learning':['#B8935A','rgba(184,147,90,.16)'],
          'retained':['#4F8A8B','rgba(79,138,139,.16)']
        }[st];
        out += '<div class="word"><div class="w-gen">'
             + '<div><span'+(w.f?' class="gl">m.</span><span':'>')+' class="w-ar">'+w.ar+'</span></div>'
             + (w.f?'<div><span class="gl">f.</span><span class="w-ar">'+w.f.ar+'</span></div>':'')
             + '<div class="w-en">'+esc(w.t)+(w.f?' · '+esc(w.f.t):'')+' \u00b7 '+esc(w.en)
             +   (w.f && w.f.en!==w.en ? ' · '+esc(w.f.en) : '')+' '+regTag(w.reg)+'</div></div>'
             + '<div style="display:flex;align-items:center;gap:8px">'
             +   playBtn(wordSrc(w), w.ar, w.reg)
             +   (w.f?playBtn(wordSrc(w.f), w.f.ar, w.reg):'')
             +   '<span class="pill" style="color:'+PILL[0]+';background:'+PILL[1]+'">'+st+'</span>'
             + '</div></div>';
      });
      out += '</div>';
    }
    out += '</div>';
  });
  return out+'</div>';
}

/* ---------- content library (§5, #3) ---------- */
var libSel = null;   /* selected passage word to gloss, or null */
var libTr = false;   /* passage reading+meaning panel open */
function wordsForPassage(pid){ return (S.userCards||[]).filter(function(w){ return w.passage===pid; }); }
function addWordToReviews(uid){
  var w = (S.userCards||[]).filter(function(x){return x.id===uid;})[0];
  if(!w || w.flagged) return;
  w.inReview = true; mountUserCards(); persist(); syncNow(); render();
}
function addPassageToReviews(pid){
  /* a word reported wrong stays out — "add all" must not quietly undo a flag */
  wordsForPassage(pid).forEach(function(w){ if(!w.flagged) w.inReview = true; });
  mountUserCards(); persist(); syncNow(); render();
}
function normKey(s){ return String(s).replace(/[ً-ْٰـ]/g,'').replace(/[^ء-ي]/g,''); }
/* [R-48] — the measurement that Step 10's "do this if measured error rates warrant"
   is gated on. Nothing measured generation accuracy, so that gate could never open.
   One tap, recorded append-only [R-32]; a flagged word is also pulled back out of
   the review deck, because the cost of a wrong card is that spaced repetition makes
   it permanent. */
function flagWord(uid){
  var w = (S.userCards||[]).filter(function(x){return x.id===uid;})[0];
  if(!w) return;
  w.flagged = !w.flagged;
  if(w.flagged) w.inReview = false;
  if(!S.flags) S.flags = [];
  S.flags.push({t:Date.now(), d:today(), id:uid, ar:w.ar, reg:w.reg||'msa',
                src:w.source_ref||'', on:!!w.flagged});
  mountUserCards(); persist(); syncNow(); render();
}
/* Every generated word carries a model's claim about its root. Curated roots were
   hand-checked; these were not, and §6.5 says a root belongs in a dictionary lookup,
   not a model's confidence. Until that lookup exists they are marked unverified. */
function rootNote(w){
  if(!w.root) return '';
  return ' · root ' + esc(w.root) + '<span class="unver" title="stated by the model that wrote this word — not checked against a dictionary">?</span>';
}
function viewLibrary(){
  if(libView) return libraryDetail(libView);

  if(!(S.passages||[]).length){
    return out + '<p class="sub">Nothing here yet. Bring in an article or some text and it becomes a short Arabic passage you can study word by word — then add its new words to your reviews when you’re ready.</p>'
      + '<button class="btn-gold" data-act="ing-open" style="margin-top:14px">＋ Bring in content</button>';
  }
  out += '<p class="sub">Passages you’ve brought in. Open one to read it word by word and add its new words to your daily reviews.</p>'
       + '<button class="btn-gold" data-act="ing-open" style="margin-top:12px;margin-bottom:4px">＋ Bring in content</button>'
       + '<div style="margin-top:8px">';
  S.passages.slice().reverse().forEach(function(p){
    var words = wordsForPassage(p.id), added = words.filter(function(w){return w.inReview;}).length;
    out += '<button class="linkcard" data-act="lib-open" data-pid="'+esc(p.id)+'">'

         + '<div class="lc-s">'+esc(p.title||p.source_ref||'your text')+' · '+words.length+' word'+(words.length===1?'':'s')
         + (words.length?(' · '+added+' in reviews'):'')+'</div></div>'

function libraryDetail(pid){
  var p = (S.passages||[]).filter(function(x){return x.id===pid;})[0];
  if(!p) { libView=null; return viewLibrary(); }
  var words = wordsForPassage(pid);
  var glossOf = {};
  words.forEach(function(w){ glossOf[normKey(w.ar)] = w; });
  var out = '<button class="subback" data-act="lib-back">'+svg(IC.back)+' Library</button>'
    + '<div class="prov">from '+esc(p.title||p.source_ref||'your text')+'</div>'
    + '<div class="ing-note" style="margin:10px 0">⚠ Auto-generated, not yet human-reviewed — diacritics may be imperfect (design doc §5, §11.3).</div>'
    + '<div class="passage" dir="rtl">';
  (p.arabic||'').split(/\s+/).forEach(function(tok){
    if(!tok) return;
    var key = normKey(tok), known = glossOf[key];
    out += '<button class="pw'+(libSel===key?' sel':'')+(known?' known':'')+'" data-say="'+esc(tok)+'"'
         + (known?' data-selword="'+esc(key)+'"':'')+'>'+esc(tok)+'</button> ';
  });
  out += '</div>';
  if(libSel && glossOf[libSel]){
    var g = glossOf[libSel];
    out += '<div class="wordgloss"><b dir="rtl" style="font-family:var(--arabic)">'+esc(g.ar)+'</b> — '
         + esc(g.en)+(g.root?' · root '+esc(g.root):'')+'</div>';
  }
  out += '<button class="tr-peek" data-tr-lib style="margin-top:12px">'+(libTr?'hide reading & meaning':'show reading & meaning')+'</button>';
  if(libTr){
    out += (p.translit?'<div class="p-tr">'+esc(p.translit)+'</div>':'')
         + (p.gloss?'<div class="p-en">'+esc(p.gloss)+'</div>':'')
         + (p.grammar?'<div class="p-gr">'+esc(p.grammar)+'</div>':'');
  }
  out += '<div class="nw-h">New words <span class="sub" style="font-weight:400">('+words.length+')</span></div>';
  var pending = words.filter(function(w){return !w.inReview && !w.flagged;}).length;
  if(pending) out += '<button class="btn-gold" data-act="lib-add-all" data-pid="'+esc(pid)+'" style="margin:4px 0 10px">Add all '+pending+' to my reviews</button>';
  words.forEach(function(w){
    out += '<div class="nw nw-lib'+(w.flagged?' flagged':'')+'"><div class="nw-txt"><div><span class="nw-ar">'+esc(w.ar)+'</span> '
         + (S.settings.trDefault?'<span class="nw-tr">'+esc(w.translit)+'</span>':'')+'</div>'
         + '<div class="nw-en">'+esc(w.en)+rootNote(w)+'</div>'
         + (w.flagged?'<div class="nw-flag">flagged as wrong — kept out of reviews</div>':'')
         + '</div>'
         + '<div style="display:flex;align-items:center;gap:6px">'
         +   (w.flagged ? ''
               : w.inReview ? '<div class="nw-in">✓ in reviews</div>'
               : '<button class="nw-add" data-act="lib-add-word" data-uid="'+esc(w.id)+'">'+svg(IC.plus)+' add</button>')
         +   '<button class="nw-bad'+(w.flagged?' on':'')+'" data-act="lib-flag" data-uid="'+esc(w.id)+'" title="'
         +     (w.flagged?'undo — put this back':'report this word as wrong')+'">'+(w.flagged?'undo':'⚑')+'</button>'
         + '</div></div>';
  });
  return out;
}

/* ---------- session ---------- */
function startSession(filter){
  var q = dueList(filter||null).slice(0,MAX_SESSION);
  if(!q.length) return;
  cardMenu = false;
  sess = {q:q,i:0,show:false,done:false,reviewed:0,xp:0};
  render();
}
/* ---------- speaking practice (production track, words only) ---------- */
function prodDue(){
  var due=[], fresh=[];
  DECK.forEach(function(c){
    if(c.type!=='vocab') return;
    if(!S.progress[c.id]) return;   /* only practice words you've started learning to read */
    var p = S.prod[c.id];
    if(!p) fresh.push(c);
    else if(p.due<=today()) due.push(c);
  });
  shuffle(due);
  due.sort(function(x,y){ var dx=S.prod[x.id].due, dy=S.prod[y.id].due; return dx<dy?-1:dx>dy?1:0; });
  shuffle(fresh);
  return due.concat(fresh);
}
function startSpeaking(){
  var q = prodDue().slice(0,MAX_SESSION);
  if(!q.length) return;
  sess = {mode:'speak', q:q, i:0, done:false, reviewed:0, xp:0};
  render();
}
function gradeSpeak(q){
  cancelMic();
  var card = sess.q[sess.i];
  var before = S.prod[card.id];
  S.prod[card.id] = schedule(before, q);            /* independent of recognition */
  logReview(card.id, 'prod', q, before, S.prod[card.id]);
  markStudied();
  var gain = q===0 ? 1 : 5;
  S.xp += gain; sess.reviewed++; sess.xp += gain;
  delete T1[card.id];
  sess.i++;
  if(sess.i >= sess.q.length) sess.done = true;
  persist(); render();
  if(sess.done) syncNow();
}
function grade(q){
  cancelMic();   /* grading moves on; discard any in-flight recording */
  var card = sess.q[sess.i];
  var before = S.progress[card.id];
  S.progress[card.id] = schedule(before, q);
  logReview(card.id, 'rec', q, before, S.progress[card.id]);
  var gain = [1,4,6,8][q];
  markStudied();
  S.xp += gain;
  sess.reviewed++; sess.xp += gain;
  sess.i++;
  sess.show = false;
  sess.showVowels = false;   /* reset the tap-to-reveal for the next card */
  sess.showTr = undefined;   /* reading falls back to the global default on each new card */
  cardMenu = false;
  if(sess.i >= sess.q.length) sess.done = true;
  persist(); render();
  if(sess.done) syncNow();   /* fire-and-forget; offline just reports unavailable */
}

/* ---------- content ingestion (§5) ---------- */
var ing = null;
function openIngest(){
  if(!CFG.url || !CFG.token){
    ing = {step:'error', msg:'Bringing in content needs your backend. Set it up in Settings → Sync first.'};
  } else { ing = {step:'input'}; }
  render();
}
function runIngest(){
  var uEl=document.getElementById('ing-url'), tEl=document.getElementById('ing-text');
  var url=(uEl?uEl.value:'').trim(), text=(tEl?tEl.value:'').trim();
  if(!url && !text){ ing.step='error'; ing.msg='Paste some text or enter a URL first.'; render(); return; }
  var base=CFG.url.replace(/\/+$/,''), hdrs={'Authorization':'Bearer '+CFG.token,'Content-Type':'application/json'};
  ing.step='ingesting'; render();
  fetch(base+'/ingest',{method:'POST',headers:hdrs,body:JSON.stringify(url?{url:url}:{text:text})})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.reason||j.error||('ingest failed ('+r.status+')')); return j; }); })
    .then(function(ins){
      ing.title=ins.title; ing.source_ref=ins.source_ref; ing.excerpt=ins.excerpt; ing.step='generating'; render();
      return fetch(base+'/generate',{method:'POST',headers:hdrs,body:JSON.stringify({excerpt:ins.excerpt, profile:learnerProfile()})})
        .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error((j.error||('generation failed ('+r.status+')'))+(j.raw?'\n\nModel returned:\n'+j.raw:'')); return j; }); });
    })
    .then(function(gen){ ing.result=gen; ing.step='result'; render(); })
    .catch(function(e){ ing.step='error'; ing.msg=e.message; render(); });
}
function materialize(){
  var g=ing.result||{}, stamp=Date.now().toString(36), pid='p-'+stamp, n=0;
  S.passages.push({id:pid, title:ing.title, source_ref:ing.source_ref, arabic:g.arabic,
    translit:g.transliteration, gloss:g.english_gloss, grammar:g.grammar_notes, created:today()});
  (g.new_words||[]).forEach(function(w,i){
    if(!w || !w.ar) return;
    /* saved to the Library, NOT the review deck — the learner opts them in later (#3) */
    S.userCards.push({id:'u-'+stamp+'-'+i, passage:pid, inReview:false,
      ar:w.ar, translit:w.translit||'', en:w.en||'',
      /* [R-51] — kept only when the model actually supplied a distinct form */
      f: (w.f && w.f !== w.ar) ? {ar:w.f, t:w.f_translit||'', en:w.en||'', a:''} : null,
      root:w.root||'', root_meaning:w.root_meaning||'', reg:targetRegister(),
      source_title:ing.title, source_ref:ing.source_ref, added:today()});
    n++;
  });
  persist(); syncNow();
  ing.addedN=n; ing.savedPid=pid; ing.step='added'; render();
}
function ingestHTML(){
  var top='<div class="ov-top"><button data-act="ing-close">'+svg(IC.x)+'</button><div class="ov-ct">Bring in content</div></div>';
  var b;
  if(ing.step==='input'){
    b='<p class="sub">Paste a paragraph, or an article link. It becomes a short passage in graded Arabic, and the new words join your reviews.</p>'
      +'<input class="inp" id="ing-url" type="url" placeholder="https://an-article-url…">'
      +'<div class="ing-or">— or —</div>'
      +'<textarea class="inp" id="ing-text" rows="5" placeholder="paste text here…"></textarea>'
      +'<button class="btn-gold" data-act="ing-run" style="margin-top:12px">Generate passage</button>'
      +'<p class="sub" style="margin-top:10px">YouTube isn’t supported yet — paste a transcript instead.</p>';
  } else if(ing.step==='ingesting'){ b='<div class="ing-load">Reading the source…</div>'; }
  else if(ing.step==='generating'){ b='<div class="ing-load">Writing your Arabic passage…<br><span class="sub">this can take a few seconds</span></div>'; }
  else if(ing.step==='result'){
    var g=ing.result||{};
    b='<div class="prov">from '+esc(ing.title||ing.source_ref||'your text')+'</div>'
      +'<div class="passage">'+esc(g.arabic||'')+'</div>'
      +(g.transliteration?'<div class="p-tr">'+esc(g.transliteration)+'</div>':'')
      +(g.english_gloss?'<div class="p-en">'+esc(g.english_gloss)+'</div>':'')
      +(g.grammar_notes?'<div class="p-gr">'+esc(g.grammar_notes)+'</div>':'')
      +'<div class="nw-h">New words</div>';
    (g.new_words||[]).forEach(function(w){
      b+='<div class="nw"><div><span class="nw-ar">'+esc(w.ar||'')+'</span> <span class="nw-tr">'+esc(w.translit||'')+'</span></div>'
        +'<div class="nw-en">'+esc(w.en||'')+(w.root?' · root '+esc(w.root):'')+'</div></div>';
    });
    var addable=(g.new_words||[]).filter(function(w){return w&&w.ar;}).length;
    b+='<div class="ing-note">⚠ Auto-generated and not yet human-reviewed — diacritics may be imperfect.</div>'
      +'<button class="btn-gold" data-act="ing-add" style="margin-top:12px">Save to Library ('+addable+' word'+(addable===1?'':'s')+')</button>'
      +'<button class="reset" data-act="ing-close" style="color:var(--muted)">Discard</button>';
  } else if(ing.step==='added'){
    return top+'<div class="ov-mid"><div class="done-wrap"><h2>Saved to Library</h2>'
      +'<p>The passage and its '+ing.addedN+' new word'+(ing.addedN===1?'':'s')+' are in your Library. Open it there to study word by word, and add words to your daily reviews when you’re ready.</p>'
      +'<div style="width:100%;max-width:320px"><button class="btn-gold" data-act="lib-go">Open Library</button>'
      +'<button class="reset" data-act="ing-close" style="color:var(--muted)">Done</button></div></div></div>';
  } else {
    b='<div class="ing-err">'+esc(ing.msg||'Something went wrong.')+'</div>'
      +'<button class="btn-teal" data-act="ing-open" style="margin-bottom:8px">Try again</button>'
      +'<button class="reset" data-act="ing-close" style="color:var(--muted)">Close</button>';
  }
  return top+'<div class="ing-wrap">'+b+'</div>';
}

function renderOverlay(){
  var o = document.getElementById('ovl');
  if(!sess){
    if(ing){ o.className='show'; o.innerHTML = ingestHTML(); }
    else { o.className=''; o.innerHTML=''; }
    return;
  }
  o.className='show';
  if(sess.done){
    var verb = sess.mode==='speak' ? 'words practiced' : 'cards reviewed';
    o.innerHTML = '<div class="done-wrap">'+starRow()
      + '<h2>Nice work</h2>'
      + '<p>'+sess.reviewed+' '+verb+' \u00b7 +'+sess.xp+' xp</p>'
      + '<div style="width:100%;max-width:320px"><button class="btn-gold" data-act="close">Done</button></div>'
      + '</div>';
    return;
  }
  if(sess.mode==='speak'){
    var sc = sess.q[sess.i], sd = sc.d, spct = (sess.i/sess.q.length)*100;
    /* One form is spoken at a time — the mic checks a single word — so speaking
       practice prompts the masculine and shows the feminine for reference. */
    var smid = '<div class="q-root">root: <span>'+sd.root+'</span> ('+esc(sd.rootMeaning)+') '+regTag(sd.reg)+'</div>'
      + '<div class="q-word">'+sd.ar+'</div>'
      + (sd.f?'<div class="fade-hint" style="cursor:default">feminine: <span style="font-family:var(--arabic)">'+sd.f.ar+'</span> · '+esc(sd.f.t)+'</div>':'')
      + '<div class="ans"><div class="a1">'+esc(sd.t)+'</div><div class="a2">'+esc(sd.en)+'</div>'
      + speakPrompt()
      + '<div class="ab-row">'+playBtn(wordSrc(sd), sd.ar, sd.reg)+micBtn(sc.id)+'</div>'
      + t1Line(sc.id)
      + '</div>';
    var sfoot = '<div class="grades" style="grid-template-columns:repeat(2,1fr)">'
      + '<button data-gs="0" style="background:rgba(193,89,46,.16);color:var(--coral)">Try again</button>'
      + '<button data-gs="2" style="background:rgba(79,138,139,.16);color:var(--teal)">Got it</button>'
      + '</div>';
    o.innerHTML = '<div class="ov-top">'
      + '<button data-act="close">'+svg(IC.x)+'</button>'
      + '<div class="ov-ct">'+(sess.i+1)+' / '+sess.q.length+' \u00b7 speaking</div>'
      + '</div>'
      + '<div class="bar"><i style="width:'+spct+'%"></i></div>'
      + '<div class="ov-mid">'+smid+'</div>'
      + '<div style="padding-bottom:6px">'+sfoot+'</div>';
    return;
  }
  var c = sess.q[sess.i], d = c.d, pct = (sess.i/sess.q.length)*100;
  var mid;
  if(c.type==='alphabet'){
    mid = '<div class="q-letter">'+d.letter+'</div>'
        + '<div class="ab-row">'+playBtn(letterSrc(d.id))+'</div>'   /* audio on both sides */
        + (sess.show ? '<div class="ans"><div class="a1">'+esc(d.name)+' \u2014 '+esc(d.translit)+' '+regTag('msa')+'</div>'
            + '<div class="a2">'+esc(d.sound)+'</div>'
            + '<div class="formrow">'+formCells(d.id,26)+'</div>'
            + (LETTER_META[d.id].guttural?'<span class="gutt">throat sound</span>':'')
            + '<div class="a3">'+d.ex+'</div>'
            + '<div class="a4">'+esc(d.exT)+' \u00b7 '+esc(d.exE)+'</div>'
            + '</div>' : '');
  } else {
    var vstage = wordStage(c.id);
    var showFull = sess.show || sess.showVowels || vstage === 'full';
    var shown = function(t){ return showFull ? t : arDisplay(t, vstage); };
    /* [R-51]: a gendered word shows BOTH forms, each labelled. The masculine
       citation form on its own is the dictionary's convention, and taking it
       wholesale leaves the learner unable to produce or recognise half of
       ordinary speech — without ever saying that is what happened. */
    mid = '<div class="q-root">root: <span>'+d.root+'</span> ('+esc(d.rootMeaning)+') '+regTag(d.reg)+'</div>'
        + (d.f
            ? '<div class="genpair">'
              + '<div class="genform"><span class="genlbl">m.</span>'
              +   '<span class="q-word"'+(showFull?'':' data-vowels="1" style="cursor:pointer"')+'>'+shown(d.ar)+'</span></div>'
              + '<div class="genform"><span class="genlbl">f.</span>'
              +   '<span class="q-word"'+(showFull?'':' data-vowels="1" style="cursor:pointer"')+'>'+shown(d.f.ar)+'</span></div>'
              + '</div>'
            : '<div class="q-word"'+(showFull?'':' data-vowels="1" style="cursor:pointer"')+'>'+shown(d.ar)+'</div>')
        + (showFull ? '' : '<div class="fade-hint" data-vowels="1">'+(vstage==='bare'?'no vowel marks':'vowels faded')+' — tap to reveal</div>')
        + '<div class="ab-row">'+playBtn(wordSrc(d), d.ar, d.reg)
            + (d.f ? playBtn(wordSrc(d.f), d.f.ar, d.reg) : '')+'</div>'   /* audio on both sides */
        + (sess.show ? '<div class="ans"><div class="a1">'
            + (d.f && d.f.en !== d.en ? esc(d.en)+' · '+esc(d.f.en) : esc(d.en))+'</div>'
            + (trShown() ? '<div class="a2 tr-read">'+esc(d.t)+(d.f?' · '+esc(d.f.t):'')+'</div>' : '')
            + (d.source?'<div class="prov">from '+esc(d.source)+'</div>':'')
            + '</div>' : '');
  }
  var foot = sess.show
    ? '<div class="grades">'
      + '<button data-g="0" style="background:rgba(193,89,46,.16);color:var(--coral)">Again</button>'
      + '<button data-g="1" style="background:rgba(184,147,90,.16);color:var(--amber)">Hard</button>'
      + '<button data-g="2" style="background:rgba(79,138,139,.16);color:var(--teal)">Good</button>'
      + '<button data-g="3" style="background:rgba(201,162,75,.16);color:var(--gold)">Easy</button>'
      + '</div>'
    : '<button class="reveal" data-act="reveal">Show answer</button>';

  var isVocab = c.type!=='alphabet';
  var ctrls = isVocab
    ? '<div class="ov-ctrls">'
      + '<button class="ovbtn'+(trShown()?' on':'')+'" data-tr-toggle title="show romanization">aA</button>'
      + '<button class="ovbtn'+(cardMenu?' on':'')+'" data-cardmenu title="options">'+svg(IC.dots)+'</button>'
      + '</div>' : '';
  var menu = (isVocab && cardMenu)
    ? '<div class="cardmenu">'
      + '<button data-pin="'+esc(c.id)+'">'+(pinned(c.id)?'Unpin vowels (use the global setting)':'Pin vowels always on for this word')+'</button>'
      + '</div>' : '';
  o.innerHTML = '<div class="ov-top">'
    +   '<button data-act="close">'+svg(IC.x)+'</button>'
    +   '<div class="ov-ct">'+(sess.i+1)+' / '+sess.q.length+'</div>'
    +   ctrls
    + '</div>'
    + menu
    + '<div class="bar"><i style="width:'+pct+'%"></i></div>'
    + '<div class="ov-mid">'+mid+'</div>'
    + '<div style="padding-bottom:6px">'+foot+'</div>';
}

/* ---------- render ---------- */
var TABS = [
  ['home','Today',IC.home],['vocab','Vocab',IC.layers],['library','Library',IC.book],
  ['progress','Progress',IC.trend],['settings','Settings',IC.gear]
];
function render(){
  document.getElementById('c-streak').textContent = S.streak;
  document.getElementById('c-xp').textContent = S.xp;
  var m = document.getElementById('main');
  m.innerHTML = tab==='home' ? viewHome()
              : tab==='vocab' ? viewVocab()
              : tab==='library' ? viewLibrary()
              : tab==='progress' ? viewProgress()
              : tab==='settings' ? viewSettings()
              : viewHome();
  document.getElementById('nav').innerHTML = TABS.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+svg(t[2])+'<span>'+t[1]+'</span></button>';
  }).join('');
  renderOverlay();
}

/* ---------- one delegated listener ---------- */
document.addEventListener('click', function(e){
  var el;
  if((el = e.target.closest('[data-vowels]'))){ if(sess){ sess.showVowels = true; render(); } return; }
  if((el = e.target.closest('[data-tr-toggle]'))){ if(sess){ sess.showTr = !trShown(); render(); } return; }
  if((el = e.target.closest('[data-cardmenu]'))){ cardMenu = !cardMenu; render(); return; }
  if((el = e.target.closest('[data-pin]'))){
    var pid = el.dataset.pin; setPin(pid, !pinned(pid));
    cardMenu = false; persist(); render(); return;
  }
  if((el = e.target.closest('[data-diac]'))){ setPref('diacritics', el.dataset.diac); render(); return; }
  if((el = e.target.closest('[data-target]'))){ setPref('target', el.dataset.target); render(); return; }
  if((el = e.target.closest('[data-set]'))){ var k=el.dataset.set; setPref(k, !S.settings[k]); render(); return; }
  if((el = e.target.closest('[data-say]'))){ speakText(el.dataset.say, el.dataset.sayReg); if(el.dataset.selword!==undefined){ libSel = libSel===el.dataset.selword ? null : el.dataset.selword; render(); } return; }
  if((el = e.target.closest('[data-tr-lib]'))){ libTr = !libTr; render(); return; }
  if((el = e.target.closest('[data-mic]'))){ toggleMic(el.dataset.mic); return; }
  if((el = e.target.closest('[data-play]'))){ playAudio(el.dataset.play, el.dataset.sayFb, el.dataset.sayReg); return; }
  if((el = e.target.closest('[data-gs]'))){ gradeSpeak(parseInt(el.dataset.gs,10)); return; }
  if((el = e.target.closest('[data-g]'))){ grade(parseInt(el.dataset.g,10)); return; }
  if((el = e.target.closest('[data-flip]'))){
    flipped[el.dataset.flip] = !flipped[el.dataset.flip]; render(); return;
  }
  if((el = e.target.closest('[data-root]'))){
    var ri = parseInt(el.dataset.root,10);
    openRoot = (openRoot===ri) ? null : ri; render(); return;
  }
  if((el = e.target.closest('[data-tab]'))){
    stopSpeech();   /* navigating away shouldn't leave a voice check playing */
    tab = el.dataset.tab; progSub=''; libView=null; libSel=null; libTr=false; cardMenu=false; render(); return;
  }
  if((el = e.target.closest('[data-act]'))){
    var a = el.dataset.act;
    if(a==='start') startSession(null);
    else if(a==='start-vocab') startSession('vocab');
    else if(a==='start-letters') startSession('alphabet');
    else if(a==='speak') startSpeaking();
    else if(a==='prog-letters'){ progSub='letters'; render(); }
    else if(a==='prog-roadmap'){ progSub='roadmap'; render(); }
    else if(a==='prog-back'){ progSub=''; render(); }
    else if(a==='lib-open'){ libView=el.dataset.pid; libSel=null; libTr=false; render(); }
    else if(a==='lib-back'){ libView=null; libSel=null; libTr=false; render(); }
    else if(a==='lib-add-word'){ addWordToReviews(el.dataset.uid); }
    else if(a==='lib-flag'){ flagWord(el.dataset.uid); }
    else if(a==='lib-add-all'){ addPassageToReviews(el.dataset.pid); }
    else if(a==='ing-open') openIngest();
    else if(a==='ing-run') runIngest();
    else if(a==='ing-add') materialize();
    else if(a==='lib-go'){ var pid=ing&&ing.savedPid; ing=null; tab='library'; libView=pid||null; libSel=null; libTr=false; render(); }
    else if(a==='ing-close'){ ing=null; render(); }
    else if(a==='probe') probeCoverage();
    else if(a==='save-sync'){
      CFG.url = (document.getElementById('sync-url').value||'').trim();
      CFG.token = (document.getElementById('sync-token').value||'').trim();
      saveCfg(); syncNow();
    }
    else if(a==='sync-now') syncNow();
    else if(a==='tts-test') ttsTest();
    else if(a==='reveal'){ sess.show=true; render(); }
    else if(a==='close'){ cancelMic(); sess=null; render(); }
    else if(a==='reset'){
      if(confirm('Erase all progress? This cannot be undone.')){
        S = ensureShape(blankState());
        flipped={}; openRoot=null; mountUserCards(); persist(); render();
      }
    }
    return;
  }
});
document.addEventListener('keydown', function(e){
  if(!sess || sess.done) return;
  if(sess.mode==='speak'){
    if(e.key===' '){ e.preventDefault(); toggleMic(sess.q[sess.i].id); }
    else if(e.key==='1'){ gradeSpeak(0); }
    else if(e.key==='2'){ gradeSpeak(2); }
    else if(e.key==='Escape'){ cancelMic(); sess=null; render(); }
    return;
  }
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!sess.show){ sess.show=true; render(); } }
  else if(sess.show && e.key>='1' && e.key<='4'){ grade(parseInt(e.key,10)-1); }
  else if(e.key==='Escape'){ sess=null; render(); }
});

mountUserCards();   /* fold any saved ingested words into the deck before first render */
render();
if(CFG.url && CFG.token) syncNow();   /* pull the other device's progress on open */

/* ---------- PWA service worker (http/https only; file:// runs without it) ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(function(){ /* offline-first is best-effort */ });
}
</script>
