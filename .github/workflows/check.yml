name: check

# Two things that are cheap to verify and expensive to notice late: the logic
# tests (which re-run across timezones, because the date bugs they cover were
# invisible in UTC), and whether content/ still matches index.html.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Logic tests
        run: node tools/test.mjs
      - name: content/ is in step with index.html
        run: node tools/sync-content.mjs --check
